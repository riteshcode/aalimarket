<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2A78" />
    <meta name="description" content="Aali Market — your town’s lowest prices, delivered home." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Aali Market</title>
  </head>
  <body>
    <script>
      // Rider pages are their own installable app (public/rider.webmanifest)
      if (location.pathname.indexOf('/rider') === 0) {
        var set = function (selector, attr, value) {
          var el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);
        };
        set('link[rel="manifest"]', 'href', '/rider.webmanifest');
        set('meta[name="theme-color"]', 'content', '#0B7A55');
        set('link[rel="apple-touch-icon"]', 'href', '/icons/rider-apple-touch-icon.png');
        var meta = document.createElement('meta');
        meta.name = 'apple-mobile-web-app-title';
        meta.content = 'Aali Rider';
        document.head.appendChild(meta);
        document.title = 'Aali Rider';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
